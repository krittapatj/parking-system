<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css"> <!-- New Admin CSS -->
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <div class="admin-sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-shield-halved logo-icon"></i>
            </div>
            <div class="sidebar-menu">
                <div class="menu-item active" onclick="loadSection('users')">รายชื่อผู้ใช้</div>
                <div class="menu-item" onclick="loadSection('providers')">รายชื่อผู้ให้เช่า</div>
                <div class="menu-item" onclick="loadSection('all-parking')">ข้อมูลพื้นที่จอดรถ</div>
                <div class="menu-item" onclick="loadSection('parking-requests')">คำขอเพิ่มพื้นที่จอดรถ</div>
                <div class="menu-item" onclick="loadSection('user-tickets')">คำร้องจากผู้ใช้</div>
                <div class="menu-item" onclick="loadSection('provider-tickets')">คำร้องเจ้าของพื้นที่</div>
                <div class="menu-item" onclick="loadSection('suspended-users')">คำร้องบัญชี (ถูกระงับ)</div>

            </div>
            <button class="menu-item logout-btn" onclick="logout()">ออกจากระบบ</button>
        </div>

        <!-- Main Content -->
        <div class="admin-main">
            <div class="main-header">
                <div class="user-info">
                    <i class="fa-solid fa-circle-user user-icon"></i>
                    <span>admin admin</span>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <!-- Dynamic Content Loaded Here -->
                Loading...
            </div>
        </div>
    </div>

    <!-- Suspension Modal -->
    <div id="suspendModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSuspendModal()">&times;</span>
            <div class="modal-header">
                <h3>Suspend User</h3>
            </div>
            <div class="modal-body">
                <p>Please enter the reason for suspension:</p>
                <textarea id="suspendReason" class="modal-input" placeholder="Violation of terms..."></textarea>
                <input type="hidden" id="suspendUserId">
            </div>
            <div class="modal-footer">
                <button class="sub-btn" onclick="closeSuspendModal()">Cancel</button>
                <button class="action-btn" onclick="confirmSuspend()">Confirm Suspend</button>
            </div>
        </div>
    </div>

    <!-- Sensor Mapping Modal -->
    <div id="sensorModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close" onclick="closeSensorModal()">&times;</span>
            <div class="modal-header">
                <h3>ตั้งค่าเซ็นเซอร์ช่องจอด</h3>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 12px;">ช่องจอด: <strong id="selectedSlotDisplay" style="color:#667eea; font-size:1.1rem;">-</strong></p>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="sensorIdInput" style="display:block; margin-bottom: 8px; font-weight: 600; color:#495057;">รหัสเซ็นเซอร์ (Sensor ID)</label>
                    <input type="text" id="sensorIdInput" placeholder="กรอก Sensor ID (เช่น SENSOR_01)" style="width:100%; padding:10px; border:1px solid #ced4da; border-radius:6px; font-size:1rem; box-sizing:border-box;">
                </div>
            </div>
            <div class="modal-footer" style="display:flex; justify-content:space-between; align-items:center; width:100%; box-sizing:border-box;">
                <button class="sub-btn" style="background:#dc3545; color:white; border:none;" onclick="unlinkSensor()">ยกเลิกการเชื่อมโยง</button>
                <div style="display:flex; gap:10px;">
                    <button class="sub-btn" onclick="closeSensorModal()">ยกเลิก</button>
                    <button class="action-btn" onclick="saveSensorMapping()" style="padding: 8px 18px; font-size:0.9rem;">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close" onclick="closeQrModal()">&times;</span>
            <div class="modal-header">
                <h3>ตั้งค่า QR Code พื้นที่</h3>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 12px;">พื้นที่: <strong id="selectedLocDisplay" style="color:#667eea; font-size:1.1rem;">-</strong></p>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="qrCodeInput" style="display:block; margin-bottom: 8px; font-weight: 600; color:#495057;">รหัส QR Code ข้อความ</label>
                    <input type="text" id="qrCodeInput" placeholder="กรอก QR Code Text" style="width:100%; padding:10px; border:1px solid #ced4da; border-radius:6px; font-size:1rem; box-sizing:border-box;">
                </div>
            </div>
            <div class="modal-footer" style="display:flex; justify-content:flex-end; gap:10px; box-sizing:border-box;">
                <button class="sub-btn" onclick="closeQrModal()">ยกเลิก</button>
                <button class="action-btn" onclick="saveLocationQr()" style="padding: 8px 18px; font-size:0.9rem;">บันทึก</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login_user.html';

        // Load Default or Navigate to requested section
        const savedSection = localStorage.getItem('adminActiveSection');
        if (savedSection) {
            localStorage.removeItem('adminActiveSection');
            loadSection(savedSection);
        } else {
            loadSection('users');
        }

        async function logout() {
            try {
                if (token) {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
            localStorage.clear();
            window.location.replace('login_user.html');
        }

        async function loadSection(section) {
            // Update Active Menu
            document.querySelectorAll('.sidebar-menu .menu-item').forEach(el => {
                el.classList.remove('active');
                if (el.getAttribute('onclick') && el.getAttribute('onclick').includes(`'${section}'`)) {
                    el.classList.add('active');
                }
            });

            const content = document.getElementById('contentArea');
            content.innerHTML = 'Loading...';

            try {
                if (section === 'users') {
                    await renderUsers();
                } else if (section === 'providers') {
                    await renderProviders();
                } else if (section === 'all-parking') {
                    await renderAllParking();
                } else if (section === 'approve-providers') {
                    await renderApproveProviders(); // Legacy Logic rewrite
                } else if (section === 'parking-requests') {
                    await renderParkingRequests(); // Legacy Logic rewrite
                } else if (section === 'user-tickets') {
                    await renderTickets('user');
                } else if (section === 'provider-tickets') {
                    await renderTickets('provider');
                } else if (section === 'suspended-users') {
                    await renderSuspendedUsers();
                } else {
                    content.innerHTML = '<h2>Feature coming soon</h2>';
                }
            } catch (err) {
                console.error(err);
                content.innerHTML = `<p>Error loading section: ${err.message}</p>`;
            }
        }

        // Global Data
        let allUsers = [];
        let allProviders = [];
        let allParking = [];
        let suspendedUsers = []; // Store specifically for this view

        // Helper fetch function to catch 401/403
        async function fetchWithAuth(url, options = {}) {
            options.headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };
            const res = await fetch(url, options);
            if (!res.ok) {
                if (res.status === 401 || res.status === 403) {
                    alert('เซสชั่นหมดอายุ หรือไม่มีสิทธิ์เข้าถึง (Session expired or unauthorized). กรุณาเข้าสู่ระบบใหม่');
                    logout();
                    throw new Error('Unauthorized');
                }
                throw new Error(`Server returned ${res.status}`);
            }
            return res.json();
        }

        // --- RENDERERS ---

        async function renderUsers() {
            try {
                allUsers = await fetchWithAuth('/api/admin/users');
                displayUsers(allUsers);
            } catch (err) {
                console.error('Error fetching users:', err);
            }
        }

        async function renderSuspendedUsers() {
            try {
                const users = await fetchWithAuth('/api/admin/users');
                suspendedUsers = users.filter(u => u.account_status === 'suspended');
                displaySuspendedUsers(suspendedUsers);
            } catch (err) {
                console.error('Error fetching suspended users:', err);
            }
        }

        function displaySuspendedUsers(users) {
            let html = `
                <div class="page-header">
                    <h2>บัญชีที่ถูกระงับการใช้งาน</h2>
                    <div class="search-bar">
                        <input type="text" placeholder="ค้นหา (ชื่อ, Email)" oninput="filterSuspendedUsers(this.value)">
                        <i class="fa-solid fa-magnifying-glass" style="color:white; margin-right:10px;"></i>
                    </div>
                </div>
                <div class="page-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ชื่อ - นามสกุล</th>
                                <th>Email / เบอร์โทร</th>
                                <th>เหตุผลระงับ</th>
                                <th>คำร้อง (Appeal)</th>
                                <th>การจัดการ</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            html += generateSuspendedRows(users);
            html += `</tbody></table></div>`;
            document.getElementById('contentArea').innerHTML = html;
        }

        function generateSuspendedRows(users) {
            if (users.length === 0) return `<tr><td colspan="5" style="text-align:center;">ไม่พบข้อมูล</td></tr>`;
            return users.map(u => `
                <tr>
                    <td>${u.first_name} ${u.last_name}</td>
                    <td>
                        <div>${u.email}</div>
                        <div style="font-size:0.85rem; color:#666;">${u.phone || '-'}</div>
                    </td>
                    <td style="color:#d9534f;">${u.suspension_reason || '-'}</td>
                    <td>
                        ${u.appeal_message ? `<div style="background:#fff3cd; color:#856404; padding:5px; border-radius:4px;">${u.appeal_message}</div>` : '-'}
                    </td>
                    <td>
                        <button class="action-btn" onclick="unsuspendUser(${u.id})">ปลดระงับ (Unsuspend)</button>
                    </td>
                </tr>
            `).join('');
        }

        function filterSuspendedUsers(query) {
            const lower = query.toLowerCase();
            const filtered = suspendedUsers.filter(u =>
                (u.first_name && u.first_name.toLowerCase().includes(lower)) ||
                (u.last_name && u.last_name.toLowerCase().includes(lower)) ||
                (u.email && u.email.toLowerCase().includes(lower))
            );
            const tbody = document.querySelector('.data-table tbody');
            if (tbody) tbody.innerHTML = generateSuspendedRows(filtered);
        }

        function generateUserRows(users) {
            if (users.length === 0) return `<tr><td colspan="5" style="text-align:center;">ไม่พบข้อมูล</td></tr>`;
            return users.map(u => {
                const isSuspended = u.account_status === 'suspended';
                const statusBadge = isSuspended
                    ? `<span class="badge danger">Suspended</span>`
                    : `<span class="badge ${u.provider_status === 'approved' ? 'success' : 'secondary'}">${u.provider_status === 'approved' ? 'Provider' : 'User'}</span>`;

                const appealInfo = u.appeal_message ? `<div style="color:red; font-size:0.8rem; margin-top:5px;">Appeal: ${u.appeal_message}</div>` : '';

                return `
                    <tr onclick="toggleActionRow('user-${u.id}')" style="cursor:pointer; ${isSuspended ? 'background-color:#ffe6e6;' : ''}">
                        <td>${u.first_name}</td>
                        <td>${u.last_name}</td>
                        <td>${u.phone || '-'}</td>
                        <td>${u.email} ${appealInfo}</td>
                        <td>${statusBadge}</td>
                    </tr>
                    <tr id="user-${u.id}" class="hidden action-row">
                        <td colspan="5" style="padding:0;">
                            <div class="flex-details" style="padding:0 15px;">
                                <div class="detail-box">
                                    <h5 style="margin-top:0;">รายละเอียดบัญชี</h5>
                                    <p><strong>ชื่อ-นามสกุล:</strong> ${u.first_name} ${u.last_name}</p>
                                    <p><strong>เบอร์โทร:</strong> ${u.phone || '-'}</p>
                                    <p><strong>เลขบัตรประชาชน:</strong> ${u.id_card_number || 'ไม่ได้ระบุ'}</p>
                                </div>
                                <div class="detail-box" style="text-align:center;">
                                    <h5 style="margin-top:0;">รูปภาพบัตรประจำตัว</h5>
                                    ${u.id_card_image ? `<img src="${u.id_card_image}" style="max-height:80px; border-radius:4px; border:1px solid #ddd;">` : '<p style="color:#888;">ไม่พบรูปภาพ</p>'}
                                </div>
                                <div class="detail-box" style="display:flex; flex-direction:column; justify-content:center; gap:10px;">
                                    ${isSuspended
                            ? `<button class="sub-btn" onclick="unsuspendUser(${u.id})">ยกเลิกการระงับบัญชี</button>`
                            : `<button class="sub-btn" onclick="openSuspendModal(${u.id})">ระงับการใช้งาน</button>`
                        }
                                    <button class="sub-btn" style="color:#dc3545; border-color:#dc3545;" onclick="deleteUser(${u.id})">ลบบัญชีผู้ใช้</button>
                                </div>
                            </div>
                            ${isSuspended ? `<div style="padding:15px; background:#fff3cd; margin:0 15px 15px; border-radius:8px; color:#856404;"><strong>เหตุผลที่ระงับ:</strong> ${u.suspension_reason}</div>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function displayUsers(users) {
            let initialSorted = [...users].sort((a, b) => b.id - a.id);
            let html = `
                <div class="page-header">
                    <h2>แก้ไขรายชื่อผู้ใช้</h2>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <select id="filterStatusUsers" onchange="filterUsers(document.getElementById('searchInputUsers').value)" style="padding:8px; border-radius:5px; border:none; font-family:inherit; cursor:pointer;">
                            <option value="all">สถานะทั้งหมด</option>
                            <option value="approved">ยืนยันตัวตนแล้ว (Provider)</option>
                            <option value="unverified">ผู้ใช้ทั่วไป (ยังไม่ยืนยัน)</option>
                        </select>
                        <select id="sortUsers" onchange="filterUsers(document.getElementById('searchInputUsers').value)" style="padding:8px; border-radius:5px; border:none; font-family:inherit; cursor:pointer;">
                            <option value="desc">ผู้ใช้ใหม่สุด</option>
                            <option value="asc">ผู้ใช้เก่าสุด</option>
                        </select>
                        <div class="search-bar">
                            <input type="text" id="searchInputUsers" placeholder="ค้นหาผู้ใช้ (ชื่อ, เบอร์, Email)" oninput="filterUsers(this.value)">
                            <i class="fa-solid fa-magnifying-glass" style="color:white; margin-right:10px;"></i>
                        </div>
                    </div>
                </div>
                <div class="page-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ชื่อ</th>
                                <th>นามสกุล</th>
                                <th>เบอร์โทร</th>
                                <th>Email</th>
                                <th>สถานะ</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            html += generateUserRows(initialSorted);

            html += `</tbody></table></div>`;
            document.getElementById('contentArea').innerHTML = html;

            // Restore focus to input if it exists (re-rendering kills focus)
            // But since we re-render the WHOLE contentArea including the input, we lose focus.
            // Better approach: Separate header (static) and list (dynamic). 
            // For simplicity in this quick refactor, let's keep it simple or fix the UX slightly.
            // FIX: We need to NOT re-render the search bar every time, or we use a separate function for just the table body.
            // Let's refactor slightly to separate Page Layout from Table Content to keep input focus.
        }

        function filterUsers(query) {
            const lowerCaseQuery = query.toLowerCase();
            const statusFilter = document.getElementById('filterStatusUsers')?.value || 'all';

            let filtered = allUsers.filter(u => {
                const matchesSearch = (u.first_name && u.first_name.toLowerCase().includes(lowerCaseQuery)) ||
                                      (u.last_name && u.last_name.toLowerCase().includes(lowerCaseQuery)) ||
                                      (u.email && u.email.toLowerCase().includes(lowerCaseQuery)) ||
                                      (u.phone && u.phone.includes(lowerCaseQuery));
                
                let matchesStatus = true;
                if (statusFilter === 'approved') {
                    matchesStatus = u.provider_status === 'approved';
                } else if (statusFilter === 'unverified') {
                    matchesStatus = u.provider_status !== 'approved';
                }

                return matchesSearch && matchesStatus;
            });
            
            const sortOrder = document.getElementById('sortUsers')?.value || 'desc';
            filtered.sort((a, b) => sortOrder === 'desc' ? b.id - a.id : a.id - b.id);
            
            updateUsersTable(filtered);
        }

        // Special function to update ONLY the table body to preserve input focus
        function updateUsersTable(users) {
            const tbody = document.querySelector('.data-table tbody');
            if (!tbody) return; // Safety check

            let html = '';
            if (users.length === 0) {
                html = `<tr><td colspan="5" style="text-align:center;">ไม่พบข้อมูล</td></tr>`;
            } else {
                users.forEach(u => {
                    const isSuspended = u.account_status === 'suspended';
                    const statusBadge = isSuspended
                        ? `<span class="badge danger">Suspended</span>`
                        : `<span class="badge ${u.provider_status === 'approved' ? 'success' : 'secondary'}">${u.provider_status === 'approved' ? 'Provider' : 'User'}</span>`;

                    const appealInfo = u.appeal_message ? `<div style="color:red; font-size:0.8rem; margin-top:5px;">Appeal: ${u.appeal_message}</div>` : '';

                    html += `
                        <tr onclick="toggleActionRow('user-table-${u.id}')" style="cursor:pointer; ${isSuspended ? 'background-color:#ffe6e6;' : ''}">
                            <td>${u.first_name}</td>
                            <td>${u.last_name}</td>
                            <td>${u.phone || '-'}</td>
                            <td>${u.email} ${appealInfo}</td>
                            <td>${statusBadge}</td>
                        </tr>
                        <tr id="user-table-${u.id}" class="hidden action-row">
                            <td colspan="5" style="padding:0;">
                                <div class="flex-details" style="padding:0 15px;">
                                    <div class="detail-box">
                                        <h5 style="margin-top:0;">รายละเอียดบัญชี</h5>
                                        <p><strong>ชื่อ-นามสกุล:</strong> ${u.first_name} ${u.last_name}</p>
                                        <p><strong>เบอร์โทร:</strong> ${u.phone || '-'}</p>
                                        <p><strong>เลขบัตรประชาชน:</strong> ${u.id_card_number || 'ไม่ได้ระบุ'}</p>
                                    </div>
                                    <div class="detail-box" style="text-align:center;">
                                        <h5 style="margin-top:0;">รูปภาพบัตรประจำตัว</h5>
                                        ${u.id_card_image ? `<img src="${u.id_card_image}" style="max-height:80px; border-radius:4px; border:1px solid #ddd;">` : '<p style="color:#888;">ไม่พบรูปภาพ</p>'}
                                    </div>
                                    <div class="detail-box" style="display:flex; flex-direction:column; justify-content:center; gap:10px;">
                                        ${isSuspended
                                ? `<button class="sub-btn" onclick="unsuspendUser(${u.id})">ยกเลิกการระงับบัญชี</button>`
                                : `<button class="sub-btn" onclick="openSuspendModal(${u.id})">ระงับการใช้งาน</button>`
                            }
                                        <button class="sub-btn" style="color:#dc3545; border-color:#dc3545;" onclick="deleteUser(${u.id})">ลบบัญชีผู้ใช้</button>
                                    </div>
                                </div>
                                ${isSuspended ? `<div style="padding:15px; background:#fff3cd; margin:0 15px 15px; border-radius:8px; color:#856404;"><strong>เหตุผลที่ระงับ:</strong> ${u.suspension_reason}</div>` : ''}
                            </td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = html;
        }

        async function renderProviders() {
            try {
                allProviders = await fetchWithAuth('/api/admin/providers');
                displayProviders(allProviders);
            } catch (err) {
                console.error('Error fetching providers:', err);
            }
        }

        function displayProviders(providers) {
            let initialSorted = [...providers].sort((a, b) => b.id - a.id);
            let html = `
                <div class="page-header">
                    <h2>รายชื่อผู้ให้เช่า</h2>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <select id="filterStatusProviders" onchange="filterProviders(document.getElementById('searchInputProviders').value)" style="padding:8px; border-radius:5px; border:none; font-family:inherit; cursor:pointer;">
                            <option value="all">สถานะทั้งหมด</option>
                            <option value="pending">รอดำเนินการ (ยังไม่ยืนยัน)</option>
                            <option value="approved">ยืนยันตัวตนแล้ว (อนุมัติแล้ว)</option>
                            <option value="rejected">ถูกปฏิเสธ</option>
                        </select>
                        <select id="sortProviders" onchange="filterProviders(document.getElementById('searchInputProviders').value)" style="padding:8px; border-radius:5px; border:none; font-family:inherit; cursor:pointer;">
                            <option value="desc">สมัครใหม่สุด</option>
                            <option value="asc">สมัครเก่าสุด</option>
                        </select>
                        <div class="search-bar">
                            <input type="text" id="searchInputProviders" placeholder="ค้นหาผู้ให้เช่า" oninput="filterProviders(this.value)">
                            <i class="fa-solid fa-magnifying-glass" style="color:white; margin-right:10px;"></i>
                        </div>
                    </div>
                </div>
                <div class="page-card">
                    <table class="data-table">
                        <thead>
                            <tr><th>ชื่อ</th><th>นามสกุล</th><th>เบอร์โทร</th><th>Email</th></tr>
                        </thead>
                        <tbody>
            `;
            // Initial body content
            html += generateProvidersRows(initialSorted);
            html += `</tbody></table></div>`;
            document.getElementById('contentArea').innerHTML = html;
        }

        function generateProvidersRows(providers) {

        function filterProviders(query) {
            const lowerCaseQuery = query.toLowerCase();
            const statusFilter = document.getElementById('filterStatusProviders')?.value || 'all';

            let filtered = allProviders.filter(p => {
                const matchesSearch = (p.first_name && p.first_name.toLowerCase().includes(lowerCaseQuery)) ||
                                      (p.last_name && p.last_name.toLowerCase().includes(lowerCaseQuery)) ||
                                      (p.email && p.email.toLowerCase().includes(lowerCaseQuery)) ||
                                      (p.phone && p.phone.includes(lowerCaseQuery));

                let matchesStatus = true;
                if (statusFilter === 'approved') {
                    matchesStatus = p.provider_status === 'approved';
                } else if (statusFilter === 'pending') {
                    matchesStatus = p.provider_status !== 'approved' && p.provider_status !== 'rejected';
                } else if (statusFilter === 'rejected') {
                    matchesStatus = p.provider_status === 'rejected';
                }

                return matchesSearch && matchesStatus;
            });
            
            const sortOrder = document.getElementById('sortProviders')?.value || 'desc';
            filtered.sort((a, b) => sortOrder === 'desc' ? b.id - a.id : a.id - b.id);
            
            const tbody = document.querySelector('.data-table tbody');
            if (tbody) tbody.innerHTML = generateProvidersRows(filtered);
        }

        async function approveProviderFromList(id) {
            if (!confirm('ยืนยันอนุมัติให้เป็นผู้ให้เช่า?')) return;
            try {
                const res = await fetch(`/api/admin/approve-provider/${id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    alert('อนุมัติผู้ให้เช่าสำเร็จ');
                    loadSection('providers');
                } else {
                    const errorData = await res.json();
                    alert('เกิดข้อผิดพลาด: ' + (errorData.message || ''));
                }
            } catch (err) {
                console.error(err);
                alert('Request failed');
            }
        }

        function toggleAdminParkingRow(dropId, headerEl) {
            const drop = document.getElementById(dropId);
            if (!drop) return;
            const isOpen = drop.style.display !== 'none';
            // close all others
            document.querySelectorAll('[id^="park-drop-"]').forEach(el => {
                el.style.display = 'none';
                el.style.borderRadius = '10px';
            });
            document.querySelectorAll('[id^="chevron-"]').forEach(el => el.style.transform = '');
            // reset all header border-radius
            document.querySelectorAll('#adminParkingCards > div > div:first-child').forEach(el => {
                el.style.borderRadius = '10px';
                el.style.borderBottomLeftRadius = '10px';
                el.style.borderBottomRightRadius = '10px';
            });
            if (!isOpen) {
                drop.style.display = 'block';
                headerEl.style.borderBottomLeftRadius = '0';
                headerEl.style.borderBottomRightRadius = '0';
                // rotate chevron
                const chevronId = dropId.replace('park-drop-', 'chevron-');
                const chev = document.getElementById(chevronId);
                if (chev) chev.style.transform = 'rotate(180deg)';
            }
        }

            html += '</div>';
            document.getElementById('contentArea').innerHTML = html;
            } catch (err) { console.error('Error in renderParkingRequests:', err); }
        }

        async function renderTickets(role) {
            try {
                const endpoint = `/api/tickets/admin/list?role=${role}`;
                const tickets = await fetchWithAuth(endpoint);

                const title = role === 'user' ? 'คำร้องผู้ใช้' : 'คำร้องเจ้าของพื้นที่';

            let html = `
                <div class="page-header"><h2>${title}</h2></div>
                <div class="page-card">
            `;

            if (tickets.length === 0) {
                html += '<p>ไม่พบรายการคำร้อง</p>';
            } else {
                html += tickets.map(t => {
                    const statusClass = getStatusClass(t.status);
                    const statusText = getStatusText(t.status);

                    // For Provider tickets, show Parking info
                    let parkingInfo = '';
                    if (role === 'provider' && t.parking_name) {
                        parkingInfo = `<div style="margin-top:5px; font-size:0.9rem; color:#666;">
                            Property: <strong>${t.parking_name}</strong> ${t.zone_name ? `(Zone: ${t.zone_name})` : ''}
                        </div>`;
                    }

                    return `
                    <div style="border-bottom:1px solid #eee; padding:15px;">
                        <div style="display:flex; justify-content:space-between; cursor:pointer;" onclick="toggleReplyRow('ticket-${t.id}')">
                            <div>
                                <strong>${t.first_name} ${t.last_name}</strong> (${t.email}) <br>
                                <span style="font-weight:600; color:#555;">${getTicketTypeText(t.ticket_type)}</span>
                                ${parkingInfo}
                            </div>
                            <div style="text-align:right;">
                                <span class="${statusClass}" style="padding:4px 8px; border-radius:4px; font-size:0.85rem; color:white;">${statusText}</span>
                                <div style="font-size:0.8rem; color:#999; margin-top:5px;">${new Date(t.created_at).toLocaleString()}</div>
                            </div>
                        </div>
                        <div style="margin-top:10px; color:#333;">${t.description}</div>
                        
                        <!-- Reply Section -->
                        <div id="ticket-${t.id}" style="display:none; margin-top:15px; background:#f9f9f9; padding:15px; border-radius:5px;">
                            <div style="margin-bottom:10px;">
                                <label style="font-weight:bold;">Update Status:</label>
                                <select id="status-${t.id}" style="padding:5px;">
                                    <option value="processing" ${t.status === 'processing' ? 'selected' : ''}>กำลังดำเนินการ</option>
                                    <option value="completed" ${t.status === 'completed' ? 'selected' : ''}>ดำเนินการเสร็จสิ้น</option>
                                </select>
                            </div>
                            <div style="margin-bottom:10px;">
                                <label style="font-weight:bold;">Reply:</label>
                                <textarea id="reply-${t.id}" rows="3" style="width:100%; padding:8px;">${t.admin_reply || ''}</textarea>
                            </div>
                            <button onclick="updateTicket(${t.id})" class="sub-btn" style="background:#007bff; color:white; border:none;">Update Ticket</button>
                        </div>
                    </div>
                    `;
                }).join('');
            }
            html += '</div>';
            document.getElementById('contentArea').innerHTML = html;
            } catch (err) { console.error('Error in renderTickets:', err); }
        }

        async function updateTicket(id) {
            const status = document.getElementById(`status-${id}`).value;
            const reply = document.getElementById(`reply-${id}`).value;

            try {
                const res = await fetch(`/api/tickets/admin/update/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: status, admin_reply: reply })
                });

                if (res.ok) {
                    alert('Ticket updated');
                    // Reload current section? Easier to just hide row or reload same section.
                    // Need to know which section we are in. A bit tricky with current structure.
                    // Let's just reload 'user-tickets' or 'provider-tickets' based on... context?
                    // Or simplistic reload.
                    const activeMenu = document.querySelector('.menu-item.active');
                    if (activeMenu) { // Trigger click again
                        activeMenu.click();
                    }
                } else {
                    alert('Error updating');
                }
            } catch (err) { console.error(err); }
        }

        function toggleReplyRow(id) {
            const el = document.getElementById(id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function getStatusText(status) {
            switch (status) {
                case 'processing': return 'กำลังดำเนินการ';
                case 'completed': return 'ดำเนินการเสร็จสิ้น';
                default: return status;
            }
        }

        // Hack to ensure badges look okay
        function getStatusClass(status) {
            // We can use inline style override in HTML generation instead of classes if css missing
            if (status === 'completed') return 'bg-success';
            if (status === 'processing') return 'bg-warning';
            return 'bg-secondary';
        }

        // Helper helper
        function getTicketTypeText(type) {
            switch (type) {
                case 'booking_issue': return 'ระบบการจองมีปัญหา';
                case 'parking_issue': return 'พื้นที่จอดรถมีปัญหา';
                case 'complaint': return 'รายงาน';
                case 'other': return 'อื่นๆ';
                case 'cancel_service': return 'ขอยกเลิกพื้นที่บริการ';
                case 'cancel_parking_lot': return 'ขอยกเลิกลานจอดรถ';
                case 'system_issue': return 'ระบบมีปัญหา';
                case 'magnet_issue': return 'แม่เหล็กมีปัญหา';
                default: return type;
            }
        }

        async function toggleDetails(id) {
            const el = document.getElementById(`details-${id}`);
            if (el.style.display === 'none') {
                el.style.display = 'block';
                if (el.innerText.includes('Loading')) {
                    // Fetch details
                    try {
                        const data = await fetchWithAuth(`/api/admin-parking/location-details/${id}`);

                        let detailsHtml = `<h4>Operating Hours</h4><ul style="list-style:none; padding:0; font-size:0.9rem;">`;
                        data.hours.forEach(h => {
                            detailsHtml += `<li><strong>${h.day_of_week}:</strong> ${h.is_open ? (h.is_24h ? '24 Hours' : `${h.open_time} - ${h.close_time}`) : 'Closed'}</li>`;
                        });
                        detailsHtml += `</ul>`;

                        detailsHtml += `<h4 style="margin-top:10px;">Zones</h4><ul style="list-style:none; padding:0; font-size:0.9rem;">`;
                        data.zones.forEach(z => {
                            detailsHtml += `<li>${z.name} (Capacity: ${z.capacity})</li>`;
                        });
                        detailsHtml += `</ul>`;

                        el.innerHTML = detailsHtml;

                    } catch (err) {
                        el.innerHTML = '<p style="color:red;">Error loading details</p>';
                    }
                }
            } else {
                el.style.display = 'none';
            }
        }


        // --- ACTIONS ---
        function toggleActionRow(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            await fetch(`/api/admin/user/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('users');
        }
        // Modal Logic
        function openSuspendModal(id) {
            document.getElementById('suspendUserId').value = id;
            document.getElementById('suspendReason').value = '';
            document.getElementById('suspendModal').style.display = 'block';
        }

        function closeSuspendModal() {
            document.getElementById('suspendModal').style.display = 'none';
        }

        async function confirmSuspend() {
            const id = document.getElementById('suspendUserId').value;
            const reason = document.getElementById('suspendReason').value;

            if (!reason) {
                alert('Please enter a reason');
                return;
            }

            try {
                const res = await fetch(`/api/admin/suspend-user/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ reason })
                });

                if (res.ok) {
                    alert('User suspended');
                    closeSuspendModal();
                    loadSection('users');
                } else {
                    const data = await res.json();
                    alert(data.message || 'Error suspending user');
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to server');
            }
        }

        async function unsuspendUser(id) {
            if (!confirm('Unsuspend this user?')) return;
            try {
                const res = await fetch(`/api/admin/unsuspend-user/${id}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    alert('User unsuspended');
                    loadSection('users');
                } else {
                    alert('Error unsuspending user');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteParking(id) {
            if (!confirm('Delete this parking?')) return;
            await fetch(`/api/admin/parking/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('all-parking');
        }
        async function suspendParking(id) {
            if (!confirm('Suspend this parking?')) return;
            await fetch(`/api/admin/suspend-parking/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('all-parking');
        }
        async function unsuspendParking(id) {
            if (!confirm('Unsuspend this parking?')) return;
            await fetch(`/api/admin/unsuspend-parking/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('all-parking');
        }

        // Logic for Approvals
        async function approveProvider(id) {
            await fetch(`/api/admin/approve-provider/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('approve-providers');
        }
        async function approveParking(id) {
            await fetch(`/api/admin-parking/approve-location/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('parking-requests');
        }
        async function rejectParking(id) {
            await fetch(`/api/admin-parking/reject-location/${id}`, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}` } });
            loadSection('parking-requests');
        }

        async function editZoneCapacity(zoneId, currentCap) {
            const newCap = prompt("Enter new capacity:", currentCap);
            if (newCap !== null && newCap !== "" && !isNaN(newCap)) {
                try {
                    const res = await fetch(`/api/admin-parking/update-zone/${zoneId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ capacity: parseInt(newCap) })
                    });

                    if (res.ok) {
                        alert("Capacity updated!");
                        // Update UI simply by Text replacement to avoid full reload
                        const el = document.getElementById(`zone-cap-${zoneId}`);
                        if (el) el.innerText = newCap;
                    } else {
                        alert("Failed to update capacity");
                    }
                } catch (e) {
                    console.error(e);
                    alert("Error updating");
                }
            }
        }

        // --- Sensor Modal Logic ---
        let currentSlotId = null;

        function openSensorModal(id, number, currentSensorId) {
            currentSlotId = id;
            document.getElementById('selectedSlotDisplay').innerText = number;
            document.getElementById('sensorIdInput').value = currentSensorId;
            document.getElementById('sensorModal').style.display = 'flex';
        }

        function closeSensorModal() {
            document.getElementById('sensorModal').style.display = 'none';
            currentSlotId = null;
        }

        async function saveSensorMapping() {
            const sensorId = document.getElementById('sensorIdInput').value.trim();
            if (!sensorId) return alert("Please enter a Sensor ID or click Unlink.");
            await updateMapping(sensorId);
        }

        async function unlinkSensor() {
            if (confirm("Are you sure you want to unlink the sensor from this slot?")) {
                await updateMapping(null); // Send null to unlink
            }
        }

        async function updateMapping(sensorId) {
            try {
                const res = await fetch('/api/admin-parking/map-sensor', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ slot_id: currentSlotId, sensor_id: sensorId })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('Success: ' + data.message);
                    closeSensorModal();
                    // Reload 'all-parking' section to refresh slots grid state
                    await renderAllParking();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('Request failed');
            }
        }

        // --- QR Modal Logic ---
        let currentLocId = null;

        function openQrModal(locId, locName, currentQr) {
            currentLocId = locId;
            document.getElementById('selectedLocDisplay').innerText = locName;
            document.getElementById('qrCodeInput').value = currentQr;
            document.getElementById('qrModal').style.display = 'flex';
        }

        function closeQrModal() {
            document.getElementById('qrModal').style.display = 'none';
            currentLocId = null;
        }

        async function saveLocationQr() {
            const qrText = document.getElementById('qrCodeInput').value.trim();
            try {
                const res = await fetch('/api/admin-parking/location-qr', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ location_id: currentLocId, qr_code_text: qrText })
                });

                const data = await res.json();
                if (res.ok) {
                    alert('Success: ' + data.message);
                    closeQrModal();
                    await renderAllParking();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('Request failed');
            }
        }

        // Close modals on outside click
        window.onclick = function (event) {
            if (event.target == document.getElementById('suspendModal')) {
                closeSuspendModal();
            }
            if (event.target == document.getElementById('sensorModal')) {
                closeSensorModal();
            }
            if (event.target == document.getElementById('qrModal')) {
                closeQrModal();
            }
        }
    </script>
</body>

</html>
