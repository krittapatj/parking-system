<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h1>Change Password</h1>
        <form id="passwordForm">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="password" required placeholder="Enter new password">
            </div>
            <button type="submit" class="btn">Update Password</button>
        </form>
        <a href="provider_profile.html" class="btn btn-secondary" style="text-align: center;">Back to Profile</a>
        <a href="index.html" class="btn-link">Back to Home</a>
    </div>
    <script src="js/profile.js"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', changePassword);
    </script>
</body>

</html>
