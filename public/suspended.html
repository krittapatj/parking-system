<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Suspended</title>
    <!-- Using Google Fonts matching Admin Dashboard -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 5px solid #dc3545;
        }

        h1 {
            color: #dc3545;
            margin-bottom: 20px;
        }

        p.reason-label {
            font-weight: bold;
            margin-bottom: 5px;
        }

        p.reason-text {
            background: #fdf2f2;
            padding: 15px;
            border: 1px solid #f5c6cb;
            color: #721c24;
            border-radius: 5px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Account Suspended</h1>
        <p>บัญชีของคุณถูกระงับการใช้งาน</p>

        <p class="reason-label">เหตุผล (Reason):</p>
        <p id="reasonText" class="reason-text">Loading...</p>

        <h3>ยื่นคำร้อง (Appeal)</h3>
        <p style="font-size:0.9rem; color:#666; margin-bottom:10px;">
            หากคุณคิดว่าเกิดข้อผิดพลาด คุณสามารถส่งคำร้องไปยังผู้ดูแลระบบได้
        </p>
        <textarea id="appealMessage" placeholder="เขียนคำร้องของคุณที่นี่..."></textarea>
        <button onclick="submitAppeal()">ส่งคำร้อง (Submit Appeal)</button>

        <a href="index.html" class="back-link">กลับสู่หน้าหลัก</a>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const reason = urlParams.get('reason');
        const email = urlParams.get('email');

        if (reason) {
            document.getElementById('reasonText').innerText = reason;
        } else {
            document.getElementById('reasonText').innerText = 'ไม่ระบุเหตุผล (No reason specified)';
        }

        async function submitAppeal() {
            const message = document.getElementById('appealMessage').value;
            if (!message) {
                alert('กรุณากรอกข้อความคำร้อง');
                return;
            }
            if (!email) {
                alert('ไม่พบข้อมูลอีเมล (Invalid Session)');
                return;
            }

            try {
                const res = await fetch('/api/auth/appeal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, appeal_message: message })
                });

                if (res.ok) {
                    alert('ส่งคำร้องเรียบร้อยแล้ว (Appeal submitted)');
                    document.getElementById('appealMessage').value = '';
                } else {
                    alert('เกิดข้อผิดพลาดในการส่งคำร้อง');
                }
            } catch (err) {
                console.error(err);
                alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
            }
        }
    </script>
</body>

</html>
