<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="centered-page">
    <div class="container" style="max-width: 400px; padding: 2.5rem 2rem;">
        <h1 style="margin-bottom: 2rem;">Change Password</h1>
        <form id="passwordForm">
            <div class="form-group">
                <label style="font-weight: 600; color: #444;">New Password</label>
                <input type="password" id="password" required placeholder="Enter new password" style="padding: 12px; font-size: 1rem; border-radius: 8px;">
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn" style="border-radius: 50px; font-weight: 600; padding: 12px; font-size: 1.05rem; background: linear-gradient(to right, #667eea, #764ba2); border: none; box-shadow: 0 4px 6px rgba(102, 126, 234, 0.4);">Update Password</button>
            </div>
        </form>
        
        <div style="margin: 1.5rem 0 0 0; display: flex; flex-direction: column; border-top: 1px solid #eee; padding-top: 1.5rem;">
            <a href="user_profile.html" class="btn btn-secondary" style="background-color: #f1f5f9; color: #475569; text-align: center; border-radius: 50px; font-weight: 600; border: none;">👤 Back to Profile</a>
        </div>
    </div>
    <script src="js/profile.js"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', changePassword);
    </script>
</body>

</html>
