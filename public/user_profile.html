<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="centered-page">
    <div class="container" style="max-width: 420px; padding: 2rem 1.5rem;">
        <h1 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Edit User Profile</h1>
        <form id="profileForm" enctype="multipart/form-data">
            <div style="text-align: center; margin-bottom: 25px;">
                <img src="https://via.placeholder.com/100" id="currentProfilePic" alt="Profile Picture"
                    style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #667eea; padding: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <br>
                <div style="margin-top: 22px;">
                    <label for="profile_pic" class="btn btn-outline" style="display: inline-block; width: auto; padding: 10px 22px; font-size: 0.95rem; font-weight: 600; margin: 0; cursor: pointer; border-radius: 50px; color: #fff; background: linear-gradient(to right, #667eea, #764ba2); border: none; box-shadow: 0 4px 6px rgba(102, 126, 234, 0.4);">
                        📷 อัปโหลดรูปภาพใหม่
                    </label>
                    <input type="file" id="profile_pic" accept="image/*" style="display: none;">
                </div>
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" required>
                <div style="margin-top: 8px; text-align: right;">
                    <a href="user_edit_pass.html" style="color: #667eea; text-decoration: none; font-weight: 600; font-size: 0.9rem;">🔒 Change Password</a>
                </div>
            </div>
            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn" style="border-radius: 50px; font-weight: 600; padding: 12px; font-size: 1.05rem; background: linear-gradient(to right, #667eea, #764ba2); border: none;">Save Changes</button>
            </div>
        </form>
        
        <div style="margin: 1.5rem 0 0 0; display: flex; flex-direction: column; border-top: 1px solid #eee; padding-top: 1.5rem;">
            <a href="welcome_user.html" class="btn btn-secondary" style="background-color: #f3e8ff; color: #764ba2; text-align: center; border-radius: 50px; font-weight: 600; border: none;">🏠 Back to Dashboard</a>
        </div>
    </div>
    <script src="js/profile.js"></script>
</body>

</html>
